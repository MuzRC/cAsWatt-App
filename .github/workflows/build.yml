name: Build & Sign CasWatt Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Unsigned Release APK
      run: gradle assembleRelease --stacktrace

    - name: Sign Android Release APK (Direct apksigner)
      run: |
        # 1. Nyahsulit Secret Base64 menjadi fail keystore fizikal
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
        
        # 2. Cari fail APK unsigned yang baru siap dibina
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Fail APK dijumpai: $UNSIGNED_APK"
        
        # 3. Kesan folder build-tools versi terkini secara automatik (34.0.0+)
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
        echo "Menggunakan Build Tools: $BUILD_TOOLS_DIR"
        
        # 4. Selaras kata laluan keystore
        STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
        KEY_PASS="${{ secrets.KEY_PASSWORD }}"
        if [ -z "$STORE_PASS" ]; then STORE_PASS="$KEY_PASS"; fi
        if [ -z "$KEY_PASS" ]; then KEY_PASS="$STORE_PASS"; fi
        
        # 5. Tandatangani APK guna apksigner rasmi
        $BUILD_TOOLS_DIR/apksigner sign \
          --ks release.keystore \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --ks-pass "pass:$STORE_PASS" \
          --key-pass "pass:$KEY_PASS" \
          --out app/build/outputs/apk/release/CasWatt-Pro-Signed.apk \
          "$UNSIGNED_APK"
          
        # 6. Sahkan ketulenan sign
        $BUILD_TOOLS_DIR/apksigner verify app/build/outputs/apk/release/CasWatt-Pro-Signed.apk
        echo "APK berjaya ditandatangani dan disahkan!"

    - name: Upload Signed Release APK ke Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CasWatt-Pro-Signed-Release-APK
        path: app/build/outputs/apk/release/CasWatt-Pro-Signed.apk
        retention-days: 14
